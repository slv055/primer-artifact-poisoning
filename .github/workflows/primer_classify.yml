name: Classify primer diff

on:
  workflow_run:
    workflows: ["Run primer"]
    types: [completed]

jobs:
  classify:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v4
        with:
          name: mypy_primer_diffs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show what the artifact dropped into the workspace
        run: ls -la . scripts

      - name: Classify diff
        run: python -m scripts.primer_classifier --diff-file diff_0.txt
        env:
          CLASSIFIER_API_KEY: ${{ secrets.PRIMER_CLASSIFIER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
