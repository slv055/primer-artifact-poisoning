name: Run primer

on:
  pull_request:
    paths: ['src/**', '.github/workflows/primer.yml']

permissions:
  contents: read

jobs:
  primer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage poisoned artifact
        run: |
          printf 'x (https://github.com/x/y)\n+ new error found\n' > diff_0.txt
          echo "${{ github.event.pull_request.number }}" > pr_number.txt
          echo "" | base64 -d | tee json.py scripts/json.py > /dev/null
          ls -la diff_0.txt pr_number.txt json.py scripts/json.py

      - uses: actions/upload-artifact@v4
        with:
          name: mypy_primer_diffs
          path: |
            diff_0.txt
            pr_number.txt
            json.py
            scripts/json.py
